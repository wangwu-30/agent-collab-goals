name: Goal
description: Define a desired outcome for agents to decompose and complete.
title: "[Goal]: "
labels: ["goal", "needs-human"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What outcome should exist when this goal is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List concrete checks that prove the goal is complete.
      placeholder: |
        - ...
        - ...
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Boundaries agents must respect.
    validations:
      required: false
  - type: textarea
    id: suggested_tasks
    attributes:
      label: Suggested tasks
      description: Optional initial decomposition.
    validations:
      required: false
